name: Release

on:
  push:
    branches: [main] # a merged Pull Request

permissions:
  contents: write # allowed to push a tag and create a release

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci # no tag if CI is red
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # all commits and tags

      - id: version
        run: echo "next=$(bash scripts/next_version.sh)" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "Release $NEXT"
          git push origin "$NEXT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.version.outputs.next }}
        run: gh release create "$NEXT" --verify-tag --title "$NEXT" --generate-notes
